note: >-
  Every /.well-known/ path was probed on every Dealpad host and NOT ONE returned a real
  document. No WellKnown, SecurityTxt, AgentCard, OpenIDConnect or APICatalog pointer is
  emitted from this file — it records an absence, and an absence must never be wired as a
  presence.

  READ THIS BEFORE RE-PROBING — dealpad.io is a wildcard-DNS catch-all and it manufactures
  false positives. Every *.dealpad.io name (including names that do not exist: a control
  probe of https://zzzznope.dealpad.io/ returned HTTP 200) resolves to the same host and
  answers 200 with the HTML shell of the Dealpad buyer sales-room single-page app. On
  api.dealpad.io the routing splits by file extension: extensionless paths fall through to
  that SPA shell and return 200 text/html, while paths ending in .json/.txt/.html are
  proxied to the Spring Boot backend and return a genuine JSON 404. That is why
  /.well-known/openid-configuration and /.well-known/oauth-authorization-server appear as
  200 below — those are the SPA shell, NOT discovery documents, and they are recorded as
  misses. A future run that trusts the status code alone will wrongly credit Dealpad with
  an OIDC discovery surface it does not serve.
