  note: >-
    No status page exists. status.dealpad.io resolves only because *.dealpad.io is a
    wildcard catch-all; it answers 200 with the buyer sales-room SPA shell, not a status
    dashboard, and must not be recorded as a status page. No StatusPage pointer is
