method: probed
source: live HTTPS probes of api.dealpad.io + search of every public dealpad.io page
summary: >-
  Dealpad publishes no lifecycle commitments of any kind — no versioning policy, no
  deprecation policy, no changelog, no status page and no SLA. What IS observable is a
  runtime versioning signal emitted by the application backend, recorded below because it
  was read directly from response headers rather than from documentation.
versioning:
  scheme: uri-path
  current: apiv1
  build_version: 3.8.5
  version_header: dealpad-version
  docs: null
  policy_published: false
  note: >-
    The application backend namespaces its routes under a literal /apiv1/ URI-path prefix
    and returns a `dealpad-version: 3.8.5` response header on every response, including
    anonymous 4xx responses. Both were observed at runtime; neither is documented anywhere
    public, and Dealpad publishes no statement about what a version bump means for
    compatibility.
